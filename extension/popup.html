<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Costco Receipt Finder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo-container">
        <img class="logo-icon" src="icons/icon32.png" alt="Costco Receipt Finder Logo">
        <span class="logo-text">Costco <span class="accent-text">Receipt Finder</span></span>
      </div>
    </header>
 
    <main class="content">
      <!-- Status Card -->
      <div class="status-card" id="statusCard">
        <div class="status-icon-container">
          <div class="status-indicator" id="statusIndicator"></div>
        </div>
        <div class="status-info">
          <div class="status-title" id="statusTitle">Checking connection...</div>
          <div class="status-desc" id="statusDesc">Please wait.</div>
        </div>
      </div>
 
      <!-- Actions -->
      <div class="actions-group">
        <button class="btn btn-primary btn-disabled" id="syncBtn" disabled>
          <svg class="btn-icon spinner-icon hidden" id="syncSpinner" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <svg class="btn-icon" id="syncIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 8L15 12H18C18 15.31 15.31 18 12 18C10.99 18 10.03 17.75 9.2 17.3L7.74 18.76C8.97 19.54 10.43 20 12 20C16.42 20 20 16.42 20 12H23L19 8ZM6 12C6 8.69 8.69 6 12 6C13.01 6 13.97 6.25 14.8 6.7L16.26 5.24C15.03 4.46 13.57 4 12 4C7.58 4 4 7.58 4 12H1L5 16L9 12H6Z" fill="currentColor"/>
          </svg>
          <span id="syncBtnText">Sync Receipts</span>
        </button>

        <button class="btn btn-accent" id="dashboardBtn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM9 17H7V10H9V17ZM13 17H11V7H13V17ZM17 17H15V13H17V17Z" fill="currentColor"/>
          </svg>
          <span>Open Web Dashboard</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <div id="lastSyncText">Never synchronized</div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
